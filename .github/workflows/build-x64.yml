name: Build TetherKit App (x86_64)

on:
  workflow_dispatch:

jobs:
  build-x64-app:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake libusb

      - name: Configure and Build GUI (x86_64)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build --target gui -j$(sysctl -n hw.ncpu)

      - name: Upload x86_64 App
        uses: actions/upload-artifact@v4
        with:
          name: TetherKit-App-x86_64
          path: dist/TetherKit.app
