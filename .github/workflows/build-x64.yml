name: Build TetherKit App Offline (x86_64)

on:
  workflow_dispatch:

jobs:
  build-x64-offline:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build static x86_64 libusb from source
        run: |
          curl -fsSL https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2 -o libusb.tar.bz2
          tar -xf libusb.tar.bz2
          cd libusb-1.0.27
          CFLAGS="-arch x86_64 -mmacosx-version-min=14.0" LDFLAGS="-arch x86_64" ./configure --host=x86_64-apple-darwin --prefix=/tmp/libusb-x64 --enable-static --disable-shared
          make -j$(sysctl -n hw.ncpu) && make install

      - name: Configure and Build GUI (x86_64)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_PREFIX_PATH=/tmp/libusb-x64
          cmake --build build --target gui -j$(sysctl -n hw.ncpu)

      - name: Upload Zero-Dependency x86_64 App
        uses: actions/upload-artifact@v4
        with:
          name: TetherKit-App-Offline-x86_64
          path: dist/TetherKit.app
