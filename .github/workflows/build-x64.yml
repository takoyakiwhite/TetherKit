name: Build TetherKit App Offline (x86_64)

on:
  workflow_dispatch:

jobs:
  build-x64-offline:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build static x86_64 libusb from source
        run: |
          curl -fsSL https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2 -o libusb.tar.bz2
          tar -xf libusb.tar.bz2
          cd libusb-1.0.27
          CFLAGS="-arch x86_64 -mmacosx-version-min=14.0" LDFLAGS="-arch x86_64" ./configure --host=x86_64-apple-darwin --prefix=/tmp/libusb-x64 --enable-static --disable-shared
          make -j$(sysctl -n hw.ncpu) && make install

      - name: Patch build-gui.sh for x86_64 and subcomponent signing
        run: |
          sed -i '' 's/swift build/swift build --arch x86_64/g' gui/Scripts/build-gui.sh
          sed -i '' 's/xcodebuild/xcodebuild ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO/g' gui/Scripts/build-gui.sh
          python3 -c '
          p = "gui/Scripts/build-gui.sh"
          s = open(p).read()
          s = s.replace("codesign ", "codesign --force --deep --sign - \"$APP_BUNDLE\" 2>/dev/null || true; find dist/TetherKit.app -type f \\( -name \"*.dylib\" -o -perm +111 \\) -exec codesign --force --sign - {} + 2>/dev/null || true; codesign ")
          open(p, "
