name: Build TetherKit (x86_64)

on:
  workflow_dispatch:

jobs:
  build-x64:
    runs-on: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: brew install cmake libusb

      - name: Configure and Build (x86_64)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Package Artifacts
        run: |
          mkdir -p release-x64
          cp -R build/bin/* release-x64/
          [ -d build/gui/TetherKit.app ] && cp -R build/gui/TetherKit.app release-x64/ || true

      - name: Upload x86_64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TetherKit-macOS-x86_64
          path: release-x64/
